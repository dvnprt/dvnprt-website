  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9;
      --fg: #111827;
      --muted: #5b6472;
      --accent: #0f766e;
      --border: #d5dae1;
      --card: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1720;
        --fg: #f1f5f9;
        --muted: #94a3b8;
        --accent: #2dd4bf;
        --border: #263444;
        --card: #16212d;
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "Aptos Mono", "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    main {
      font-size: 1rem;
      width: 100%;
      max-width: 1100px;
      text-align: center;
    }

    h1 {
      font-family: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
      font-size: clamp(4.5rem, min(30vw, 38dvh), 22rem);
      font-weight: 800;
      letter-spacing: 0.01em;
      line-height: 1;
      margin-bottom: -0.28em;
      white-space: nowrap;
      user-select: none;
      background: linear-gradient(180deg, var(--fg) 0%, var(--fg) 25%, transparent 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
    }

    @media (forced-colors: active) {
      h1 {
        background: none;
        -webkit-text-fill-color: CanvasText;
        color: CanvasText;
      }
    }

    .fullname {
      position: relative;
      z-index: 1;
      font-size: clamp(1rem, 3.6vw, 1.25rem);
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--fg);
    }

    .subtitle {
      margin-top: 8px;
      font-size: clamp(0.8rem, 3vw, 1rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
    }

    .rule {
      width: 48px;
      height: 3px;
      background: var(--accent);
      border: 0;
      border-radius: 2px;
      margin: 28px auto;
    }

    .bio {
      color: var(--muted);
      font-size: clamp(1rem, 3.6vw, 1.15rem);
      line-height: 1.65;
      max-width: 48ch;
      margin: 0 auto;
      text-wrap: pretty;
    }

    nav {
      margin-top: 32px;
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 8px;
      transition: color 0.2s ease, transform 0.2s ease, filter 0.2s ease;
    }

    nav a svg {
      width: 30px;
      height: 30px;
      fill: currentColor;
    }

    @media (hover: hover) {
      nav a:hover {
        color: var(--accent);
        transform: translateY(-2px);
        filter: drop-shadow(0 0 8px var(--accent));
      }
    }

    nav a:focus-visible {
      color: var(--accent);
      transform: translateY(-2px);
      filter: drop-shadow(0 0 8px var(--accent));
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    nav a:active {
      color: var(--accent);
    }

    @media (prefers-reduced-motion: no-preference) {
      h1 {
        animation: fade-in 750ms ease-out both;
      }

      .fullname {
        animation: rise-in 650ms ease-out 150ms both;
      }

      .subtitle {
        animation: rise-in 650ms ease-out 250ms both;
      }

      .rule {
        animation: expand-in 600ms ease-out 450ms both;
      }

      .bio {
        animation: rise-in 650ms ease-out 550ms both;
      }

      nav {
        animation: rise-in 600ms ease-out 800ms both;
      }

      nav:focus-within {
        animation: none;
      }

      nav a:active {
        transform: scale(0.96);
      }
    }

    @keyframes fade-in {
      from {
        opacity: 0;
      }
    }

    @keyframes rise-in {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
    }

    @keyframes expand-in {
      from {
        opacity: 0;
        transform: scaleX(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      nav a,
      nav a:hover,
      nav a:focus-visible {
        transition: none;
        transform: none;
      }
    }

    @media (max-height: 520px) {
      .rule {
        margin: 16px auto;
      }

      nav {
        margin-top: 20px;
      }

      .bio {
        line-height: 1.5;
      }
    }
  </style>
</head>
